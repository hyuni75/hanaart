{% extends 'admin_panel/base.html' %}

{% block title %}아트페어 관리{% endblock %}

{% block content %}
<div class="page-header">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h1 class="page-title">
                <i class="fas fa-calendar-alt"></i> 아트페어 관리
            </h1>
            <p class="page-subtitle">아트페어 참가 이력을 관리합니다</p>
        </div>
        <button type="button" class="btn btn-primary" onclick="openCreateArtfairModal()">
            <i class="fas fa-plus"></i> 아트페어 추가
        </button>
    </div>
</div>

<!-- 아트페어 목록 -->
<div class="card">
    <div class="card-header">
        <i class="fas fa-list"></i> 아트페어 목록
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th style="width: 100px;">연도</th>
                        <th>제목</th>
                        <th style="width: 200px;">이미지</th>
                        <th>설명</th>
                        <th style="width: 100px;">상태</th>
                        <th style="width: 150px;" class="text-center">관리</th>
                    </tr>
                </thead>
                <tbody id="artfairTableBody">
                    <tr>
                        <td colspan="6" class="text-center py-5 text-muted">
                            로딩중...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let deleteTargetId = null;

    $(document).ready(function() {
        loadArtfairs();
    });

    function loadArtfairs() {
        $.ajax({
            url: '/admin-panel/api/artfair/list/',
            method: 'GET',
            success: function(response) {
                renderArtfairs(response.artfairs);
            },
            error: function(xhr) {
                console.error('아트페어 목록 로드 실패:', xhr.responseText);
                showToast('아트페어 목록을 불러오는데 실패했습니다.', 'error');
            }
        });
    }

    function renderArtfairs(artfairs) {
        const tbody = $('#artfairTableBody');
        tbody.empty();

        if (artfairs.length === 0) {
            tbody.append(`
                <tr>
                    <td colspan="6" class="text-center py-5 text-muted">
                        등록된 아트페어가 없습니다
                    </td>
                </tr>
            `);
            return;
        }

        artfairs.forEach(function(artfair) {
            const descPreview = artfair.description && artfair.description.length > 30
                ? artfair.description.substring(0, 30) + '...'
                : (artfair.description || '-');

            const statusBadge = artfair.is_active
                ? '<span class="badge bg-success">활성</span>'
                : '<span class="badge bg-secondary">비활성</span>';

            const imagePreview = artfair.image
                ? `<img src="${artfair.image}" alt="${artfair.title}" style="max-height: 60px; max-width: 100px; object-fit: cover;">`
                : '<span class="text-muted">이미지 없음</span>';

            tbody.append(`
                <tr>
                    <td><strong>${artfair.year}</strong></td>
                    <td>${artfair.title}</td>
                    <td>${imagePreview}</td>
                    <td>${descPreview}</td>
                    <td>${statusBadge}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-primary" onclick="openEditArtfairModal(${artfair.id})">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="openDeleteArtfairModal(${artfair.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `);
        });
    }

    function openCreateArtfairModal() {
        const formContent = `
            <form id="artfairForm" enctype="multipart/form-data">
                <input type="hidden" id="artfairId">

                <div class="mb-3">
                    <label for="artfairYear" class="form-label">연도 *</label>
                    <input type="number" class="form-control" id="artfairYear" required
                           min="1900" max="2100" placeholder="예: 2023">
                </div>

                <div class="mb-3">
                    <label for="artfairTitle" class="form-label">제목 *</label>
                    <input type="text" class="form-control" id="artfairTitle" required
                           placeholder="예: 한국국제아트페어(KIAF)">
                </div>

                <div class="mb-3">
                    <label for="artfairDescription" class="form-label">설명</label>
                    <textarea class="form-control" id="artfairDescription" rows="3"
                              placeholder="아트페어 설명 (선택사항)"></textarea>
                </div>

                <div class="mb-3">
                    <label for="artfairImage" class="form-label">이미지</label>
                    <input type="file" class="form-control" id="artfairImage" accept="image/*">
                    <small class="text-muted">현재 이미지가 있는 경우 새 파일 선택 시 교체됩니다</small>
                    <div id="currentImagePreview" class="mt-2"></div>
                </div>

                <div class="mb-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="artfairIsActive" checked>
                        <label class="form-check-label" for="artfairIsActive">
                            활성화
                        </label>
                    </div>
                </div>
            </form>
        `;

        window.showCreateModal('아트페어 추가', formContent, function($modal) {
            saveArtfair(false, $modal);
        }, { modalId: 'artfairModal', size: 'modal-lg' });
    }

    function openEditArtfairModal(id) {
        $.ajax({
            url: `/admin-panel/api/artfair/${id}/`,
            method: 'GET',
            success: function(artfair) {
                const formContent = `
                    <form id="artfairForm" enctype="multipart/form-data">
                        <input type="hidden" id="artfairId" value="${artfair.id}">

                        <div class="mb-3">
                            <label for="artfairYear" class="form-label">연도 *</label>
                            <input type="number" class="form-control" id="artfairYear" value="${artfair.year}" required
                                   min="1900" max="2100" placeholder="예: 2023">
                        </div>

                        <div class="mb-3">
                            <label for="artfairTitle" class="form-label">제목 *</label>
                            <input type="text" class="form-control" id="artfairTitle" value="${artfair.title}" required
                                   placeholder="예: 한국국제아트페어(KIAF)">
                        </div>

                        <div class="mb-3">
                            <label for="artfairDescription" class="form-label">설명</label>
                            <textarea class="form-control" id="artfairDescription" rows="3"
                                      placeholder="아트페어 설명 (선택사항)">${artfair.description || ''}</textarea>
                        </div>

                        <div class="mb-3">
                            <label for="artfairImage" class="form-label">이미지</label>
                            <input type="file" class="form-control" id="artfairImage" accept="image/*">
                            <small class="text-muted">현재 이미지가 있는 경우 새 파일 선택 시 교체됩니다</small>
                            <div id="currentImagePreview" class="mt-2">
                                ${artfair.image ? `
                                    <div class="mt-2">
                                        <p class="mb-2">현재 이미지:</p>
                                        <img src="${artfair.image}" alt="${artfair.title}"
                                             style="max-height: 200px; max-width: 100%; object-fit: contain;">
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="artfairIsActive" ${artfair.is_active ? 'checked' : ''}>
                                <label class="form-check-label" for="artfairIsActive">
                                    활성화
                                </label>
                            </div>
                        </div>
                    </form>
                `;

                window.showEditModal('아트페어 수정', formContent, function($modal) {
                    saveArtfair(true, $modal);
                }, { modalId: 'artfairModal', size: 'modal-lg' });
            },
            error: function(xhr) {
                console.error('아트페어 조회 실패:', xhr.responseText);
                showToast('아트페어 정보를 불러오는데 실패했습니다.', 'error');
            }
        });
    }

    function saveArtfair(isEdit, $modal) {
        const id = $('#artfairId').val();
        const url = isEdit ? `/admin-panel/api/artfair/${id}/update/` : '/admin-panel/api/artfair/create/';

        const formData = new FormData();
        formData.append('year', $('#artfairYear').val());
        formData.append('title', $('#artfairTitle').val());
        formData.append('description', $('#artfairDescription').val() || '');
        formData.append('is_active', $('#artfairIsActive').is(':checked') ? 'true' : 'false');

        const imageFile = $('#artfairImage')[0].files[0];
        if (imageFile) {
            formData.append('image', imageFile);
        }

        $.ajax({
            url: url,
            method: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: function(response) {
                showToast(isEdit ? '아트페어가 수정되었습니다.' : '아트페어가 추가되었습니다.', 'success');
                closeModal($modal);
                loadArtfairs();
            },
            error: function(xhr) {
                console.error('아트페어 저장 실패:', xhr.responseText);
                const errorMsg = xhr.responseJSON?.message || '아트페어 저장에 실패했습니다.';
                showToast(errorMsg, 'error');
            }
        });
    }

    function openDeleteArtfairModal(id) {
        deleteTargetId = id;
        window.showDeleteModal(
            '정말로 이 아트페어를 삭제하시겠습니까?',
            function($modal) {
                confirmDeleteArtfair($modal);
            },
            {
                modalId: 'artfairDeleteModal',
                title: '아트페어 삭제',
                dangerText: '이 작업은 되돌릴 수 없습니다.'
            }
        );
    }

    function confirmDeleteArtfair($modal) {
        if (!deleteTargetId) return;

        $.ajax({
            url: `/admin-panel/api/artfair/${deleteTargetId}/delete/`,
            method: 'POST',
            success: function(response) {
                showToast('아트페어가 삭제되었습니다.', 'success');
                closeModal($modal);
                deleteTargetId = null;
                loadArtfairs();
            },
            error: function(xhr) {
                console.error('아트페어 삭제 실패:', xhr.responseText);
                showToast('아트페어 삭제에 실패했습니다.', 'error');
            }
        });
    }
</script>
{% endblock %}
