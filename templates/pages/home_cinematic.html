{% extends 'base.html' %}
{% load static %}

{% block title %}하나아트갤러리 - Cinematic Experience{% endblock %}

{% block extra_css %}
<style>
    /* base.html 요소 강제 숨김 - 충돌 방지 */
    #mainNavbar,
    .navbar,
    .footer,
    footer {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
    }

    /* main 태그 리셋 */
    main {
        margin: 0 !important;
        padding: 0 !important;
    }

    body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
        font-family: 'Cormorant Garamond', serif;
    }

    /* 시네마틱 네비게이션 */
    .cinematic-nav {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 1000;
        padding: 3rem 5rem;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        pointer-events: none;
    }

    .cinematic-nav * {
        pointer-events: auto;
    }

    .cinematic-brand {
        display: none; /* 좌측 상단 브랜드 문구 숨김 */
    }

    .cinematic-menu {
        display: flex;
        gap: 2.5rem;
        list-style: none;
        margin: 0;
        padding: 1.2rem 2.5rem;
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 50px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .cinematic-menu a {
        color: #000;
        text-decoration: none;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 3px;
        text-transform: uppercase;
        transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        position: relative;
        font-family: 'Montserrat', sans-serif;
        text-shadow: none;
    }

    .cinematic-menu a::before {
        content: '';
        position: absolute;
        top: 50%;
        left: -20px;
        width: 0;
        height: 1px;
        background: #000;
        transition: width 0.6s cubic-bezier(0.19, 1, 0.22, 1);
    }

    .cinematic-menu a:hover::before {
        width: 10px;
    }

    /* 풀스크린 슬라이더 */
    .cinematic-slider {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
    }

    .slide {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 1.5s cubic-bezier(0.19, 1, 0.22, 1);
        will-change: transform, opacity;
    }

    .slide.active {
        opacity: 1;
        z-index: 2;
    }

    .slide.prev {
        z-index: 1;
    }

    .slide-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        transform: scale(1);
        transition: transform 8s cubic-bezier(0.19, 1, 0.22, 1);
    }

    .slide.active .slide-bg {
        transform: scale(1.1);
    }

    .slide-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
            135deg,
            rgba(0, 0, 0, 0.7) 0%,
            rgba(0, 0, 0, 0.3) 50%,
            rgba(0, 0, 0, 0.8) 100%
        );
    }

    /* 시네마틱 텍스트 애니메이션 */
    .slide-content {
        position: absolute;
        bottom: 15%;
        left: 5rem;
        max-width: 50%;
        color: #fff;
        z-index: 10;
    }

    .slide-content h2 {
        font-size: 5rem;
        font-weight: 300;
        letter-spacing: -2px;
        margin: 0 0 1.5rem 0;
        line-height: 0.95;
        opacity: 0;
        transform: translateY(100px);
        transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1);
    }

    .slide.active .slide-content h2 {
        opacity: 1;
        transform: translateY(0);
        transition-delay: 0.3s;
    }

    .slide-content .artist {
        font-size: 1.5rem;
        font-weight: 300;
        letter-spacing: 6px;
        text-transform: uppercase;
        margin-bottom: 1rem;
        opacity: 0;
        transform: translateY(50px);
        transition: all 1s cubic-bezier(0.19, 1, 0.22, 1);
        font-family: 'Montserrat', sans-serif;
    }

    .slide.active .slide-content .artist {
        opacity: 0.8;
        transform: translateY(0);
        transition-delay: 0.5s;
    }

    .slide-content .year {
        font-size: 1.2rem;
        font-weight: 300;
        letter-spacing: 3px;
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
    }

    .slide.active .slide-content .year {
        opacity: 0.6;
        transform: translateY(0);
        transition-delay: 0.7s;
    }

    /* 네비게이션 컨트롤 */
    .slider-controls {
        position: fixed;
        bottom: 5rem;
        right: 5rem;
        z-index: 100;
        display: flex;
        gap: 2rem;
    }

    .slider-btn {
        width: 60px;
        height: 60px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        color: #fff;
        font-size: 1.5rem;
    }

    .slider-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: #fff;
        transform: scale(1.1);
    }

    /* 진행률 인디케이터 */
    .progress-indicator {
        position: fixed;
        bottom: 3rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 1rem;
        z-index: 100;
    }

    .progress-dot {
        width: 12px;
        height: 12px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        position: relative;
    }

    .progress-dot::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        width: 6px;
        height: 6px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    }

    .progress-dot.active::after {
        transform: translate(-50%, -50%) scale(1);
    }

    .progress-dot:hover {
        border-color: #fff;
        transform: scale(1.3);
    }

    /* 슬라이드 카운터 */
    .slide-counter {
        position: fixed;
        top: 50%;
        right: 5rem;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.5);
        font-size: 1.2rem;
        font-weight: 300;
        letter-spacing: 3px;
        z-index: 100;
        writing-mode: vertical-rl;
        font-family: 'Montserrat', sans-serif;
    }

    /* 장식용 애니메이션 (계속 표시) */
    .decoration-animation {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, calc(-50% - 80px));
        z-index: 40;
        pointer-events: none;
    }

    .loading-line {
        width: 400px;
        height: 2px;
        background: rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
    }

    .loading-line::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: #fff;
        animation: loadingSlide 2s ease infinite;
    }

    @keyframes loadingSlide {
        to { left: 100%; }
    }

    .loading-title {
        color: #fff;
        font-size: 1.5rem;
        font-weight: 300;
        letter-spacing: 8px;
        text-transform: uppercase;
        margin-top: 3rem;
        font-family: 'Playfair Display', serif;
    }

    /* 중앙 고정 타이틀 (항상 표시) */
    .center-title {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 50;
        pointer-events: none;
    }

    .center-title-text {
        color: #fff;
        font-size: 3rem;
        font-weight: 300;
        letter-spacing: 12px;
        text-transform: uppercase;
        font-family: 'Playfair Display', serif;
        text-shadow: 2px 2px 20px rgba(0, 0, 0, 0.9);
        margin: 0;
        opacity: 0;
        animation: fadeInTitle 1s ease 0s forwards;
    }

    @keyframes fadeInTitle {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 0.8;
            transform: translateY(0);
        }
    }

    /* 반응형 */
    @media (max-width: 768px) {
        .cinematic-nav {
            padding: 2rem;
        }

        .cinematic-brand {
            font-size: 1.5rem;
            letter-spacing: 4px;
        }

        .cinematic-menu {
            display: none;
        }

        .slide-content {
            left: 2rem;
            bottom: 10%;
            max-width: 80%;
        }

        .slide-content h2 {
            font-size: 3rem;
        }

        .slide-content .artist {
            font-size: 1.2rem;
        }

        .slider-controls {
            bottom: 2rem;
            right: 2rem;
        }

        .slide-counter {
            right: 2rem;
        }

        .center-title-text {
            font-size: 2rem;
            letter-spacing: 8px;
        }
    }
</style>
